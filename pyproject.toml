[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "updatesentinel"
version = "0.1.0"
description = "Diagnóstico explicável de atualizações para Arch Linux e CachyOS"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["psutil>=6"]

[project.optional-dependencies]
gui = ["PySide6>=6.8,<7"]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2"]

[project.scripts]
updatesentinel = "update_sentinel.cli:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/update_sentinel"]
