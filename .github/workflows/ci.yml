name: Qualidade
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Instalar bibliotecas nativas do Qt
        # Offscreen dispensa o display, mas QtGui ainda carrega EGL/GL, XKB e fontes.
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libgl1 libxkbcommon0 libfontconfig1
      - run: python -m pip install -e '.[gui,dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m build
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: updatesentinel demo --json
